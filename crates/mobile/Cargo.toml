[package]
name = "sonora_mobile"
description = "Puente entre el motor de Sonora (crate `music`) y la app de iPhone, expuesto con UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "sonora_mobile"
# staticlib: lo que enlaza la app de iOS. lib: para poder usarlo desde otros crates y tests.
crate-type = ["staticlib", "lib"]

[dependencies]
anyhow.workspace = true
dirs.workspace = true
futures.workspace = true
log.workspace = true
music.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Las raíces de certificados del sistema no se leen en iOS; se usan las de webpki.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
uniffi = "0.29"

# rquickjs (lo usa ytmusic) no trae bindings precompilados para iOS ni Android: se generan al
# compilar. Las raíces TLS se escriben a mano en los dos (ver `roots.rs`).
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { version = "0.12", default-features = false, features = ["bindgen"] }
base64.workspace = true
webpki-root-certs = "1"

# Android: cpal necesita el contexto de la app (JavaVM + Context) para hablar con AAudio.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
# Android no deja enlazar con su SQLite: se compila el de la librería.
music = { workspace = true, features = ["bundled-sqlite"] }
